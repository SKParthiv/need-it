name: Deploy

# Push to main -> Backend CI green -> trigger Render deploy hook.
# Render autoDeploy is disabled; this pipeline is the only deploy path.
on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        # Until the RENDER_DEPLOY_HOOK_URL secret exists (Render service not
        # created yet), skip cleanly instead of failing red on main.
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy (set it after creating the Render service)."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
