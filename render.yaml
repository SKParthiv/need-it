# Render Blueprint — free-tier production deploy of the backend.
# Dashboard → New → Blueprint → pick this repo. Fill the sync:false secrets.
#
# autoDeploy is OFF on purpose: deploys are triggered by the GitHub Actions
# "Deploy" workflow (which runs only after Backend CI passes on main).
# In Render: service → Settings → Build & Deploy → copy the Deploy Hook URL
# into this repo's secrets as RENDER_DEPLOY_HOOK_URL.
services:
  - type: web
    name: needit-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --no-input && python manage.py ensure_admin
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: COLLEGE_EMAIL_DOMAINS
        value: sastra.ac.in
      - key: DJANGO_SECRET_KEY
        sync: false        # generate: python -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false        # e.g. needit-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false        # e.g. https://needit-api.onrender.com (needed for /admin/)
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # web app origin(s), comma-separated
      - key: PUBLIC_API_BASE_URL
        sync: false        # e.g. https://needit-api.onrender.com (used in verification emails)
      - key: POSTGRES_HOST
        sync: false        # from Neon dashboard
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      # Superuser bootstrap (ensure_admin; no-ops if unset). Remove after first deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Real verification emails. Render free BLOCKS outbound SMTP (25/465/587),
      # so use SendGrid's HTTP API: free 100 emails/day, no card. Sign up,
      # Settings -> Sender Authentication -> Verify a Single Sender (a Gmail
      # works), then Settings -> API Keys -> create (Full Access).
      # (Brevo also works via BREVO_API_KEY, but their IP-restriction can
      #  block Render's dynamic egress — SendGrid is the default for a reason.)
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false        # e.g. Need It <you@gmail.com> — must be the verified sender
      # (EMAIL_HOST/EMAIL_HOST_USER/EMAIL_HOST_PASSWORD also work as SMTP fallback
      #  where port 587 isn't blocked — e.g. a future paid host or local testing.)
      # Without email config, register returns the token in the API response.
