# Render Blueprint — one-click free-tier deploy of the backend.
# Dashboard → New → Blueprint → pick this repo. Render reads this file.
# You only fill in the 4 secret env vars (marked sync: false).
services:
  - type: web
    name: needit-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false        # generate: python -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false        # your Render domain, e.g. needit-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # your web app origin(s), comma-separated
      - key: POSTGRES_HOST
        sync: false        # from Neon dashboard (host without the port)
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
